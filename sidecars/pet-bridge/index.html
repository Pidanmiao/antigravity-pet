<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>AGY 桌宠</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="status-dot" id="pet-dot" aria-hidden="true"></span>
        <div>
          <h1 class="brand-title">AGY 桌宠</h1>
          <span class="brand-sub" id="pet-status-text">正在检测桌宠状态…</span>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="primary-btn" id="btn-launch">启动 / 唤醒</button>
      </div>
    </header>

    <main class="content">
      <section class="card">
        <div class="card-head">
          <h2 class="card-title">当前会话上下文</h2>
          <span class="source-pill" id="focus-badge">—</span>
        </div>
        <div class="conv-title" id="conv-title">等待会话数据…</div>
        <div class="conv-meta" id="conv-model">当前模型：—</div>

        <div class="meter-block">
          <div class="meter-row">
            <span class="meter-label">上下文占用（不含思考 token）</span>
            <strong class="meter-value" id="ctx-text">—</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="ctx-bar" style="width:0%"></div>
          </div>
        </div>

        <div class="kpi-row">
          <div class="kpi-cell">
            <span class="kpi-label">流式速率</span>
            <strong class="kpi-val" id="kpi-speed">—</strong>
          </div>
          <div class="kpi-cell">
            <span class="kpi-label">5h 限额</span>
            <strong class="kpi-val" id="kpi-5h">—</strong>
          </div>
          <div class="kpi-cell">
            <span class="kpi-label">周限额</span>
            <strong class="kpi-val" id="kpi-week">—</strong>
          </div>
          <div class="kpi-cell">
            <span class="kpi-label">缓存命中</span>
            <strong class="kpi-val" id="kpi-cache">—</strong>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title">桌宠形态</h2>
          <label class="switch-label">
            <input type="checkbox" id="chk-follow-model">
            <span>跟随模型自动切换</span>
          </label>
        </div>
        <div class="form-grid" id="form-grid" role="group" aria-label="桌宠形态选择"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title">HUD 悬浮条与联动设置</h2>
        </div>

        <div class="setting-row">
          <label class="field-label" for="sel-pinned">监控会话</label>
          <select id="sel-pinned" class="select-input"></select>
        </div>

        <div class="setting-row">
          <label class="field-label" for="sel-appearance">HUD 外观</label>
          <select id="sel-appearance" class="select-input">
            <option value="dialog">对话框卡片（默认）</option>
            <option value="capsule">暗色胶囊</option>
            <option value="glass">轻透毛玻璃</option>
            <option value="seamless">无边框透明底</option>
          </select>
        </div>

        <div class="setting-row">
          <label class="field-label" for="sel-hud-mode">HUD 位置</label>
          <select id="sel-hud-mode" class="select-input">
            <option value="attached">跟随桌宠</option>
            <option value="floating">独立悬浮（可拖到输入框旁）</option>
          </select>
        </div>

        <div class="setting-row">
          <label class="field-label" for="sel-hud-visibility">HUD 显示</label>
          <div class="inline-control">
            <select id="sel-hud-visibility" class="select-input">
              <option value="show">显示</option>
              <option value="auto">自动</option>
              <option value="hide">隐藏</option>
            </select>
            <label class="delay-box" id="wrap-hud-delay" hidden>
              <input type="number" id="inp-hud-delay" class="number-input" min="1" max="60" step="1" value="5" aria-label="自动隐藏秒数">
              <span>秒</span>
            </label>
          </div>
        </div>

        <div class="toggle-grid">
          <label class="switch-label"><input type="checkbox" id="chk-hud-locked"><span>锁定悬浮坐标</span></label>
          <label class="switch-label"><input type="checkbox" id="chk-autonomy"><span>自主爬窗与互动</span></label>
          <label class="switch-label"><input type="checkbox" id="chk-reactions"><span>对速率/限额做出反应</span></label>
          <label class="switch-label"><input type="checkbox" id="chk-auto-launch"><span>插件启动时自动拉起桌宠</span></label>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span id="status-msg">修改后约 1.5 秒内自动同步到桌面宠物</span>
      <span id="last-sync">—</span>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
